        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* CSS Khusus Artikel Markdown */
        .prose h1 { font-family: 'Merriweather', serif; font-size: 2.25rem; font-weight: bold; margin-top: 2rem; margin-bottom: 1rem; color: var(--c-dark, #022c22); line-height: 1.3;}
        .prose h2 { font-family: 'Merriweather', serif; font-size: 1.5rem; font-weight: bold; margin-top: 2rem; margin-bottom: 1rem; color: var(--c-primary, #059669); }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #4b5563; }
        .prose img { border-radius: 0.75rem; margin: 2rem auto; max-width: 100%; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .prose blockquote { border-left: 4px solid var(--c-accent, #f59e0b); padding-left: 1rem; font-style: italic; color: #6b7280; background: var(--c-light, #f9fafb); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.25rem;}
        
        .toc-scrollbar::-webkit-scrollbar { width: 6px; }
        .toc-scrollbar::-webkit-scrollbar-thumb { background: var(--c-primary, #10b981); border-radius: 10px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* FITUR BARU: CSS untuk Dropdown Daftar Isi (Accordion) */
        .toc-category-content { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .toc-category-item.active .toc-category-content { opacity: 1; }
        .toc-icon { transition: transform 0.3s ease; }
        .toc-category-item.active .toc-icon { transform: rotate(180deg); }

    <script>
        let allArticles = [];
        let filteredArticles = [];
        let categories = ["Semua"];
        let currentPage = 1;
        const postsPerPage = 6; 
        let currentCategory = "Semua";
        let currentSearchQuery = "";

        const dummyArticles = [
            { title: "Keutamaan Belajar Al-Quran", category: "Fiqih", date: "2024-05-01", author: "Ust. Fulan", thumbnail: "https://images.unsplash.com/photo-1609599006353-e629aaabfeae?w=800", excerpt: "Sebaik-baik kalian adalah yang mempelajari Al-Quran...", content: "Isi artikel..." },
            { title: "Mengenal 4 Imam Mazhab", category: "Sejarah Islami", date: "2024-05-05", author: "Admin", thumbnail: "https://images.unsplash.com/photo-1519817650390-64a93db51149?w=800", excerpt: "Sejarah singkat tokoh besar Islam...", content: "Isi artikel..." }
        ];

        function createSafeSlug(text) {
            return text.toString().toLowerCase()
                .replace(/\s+/g, '-')           
                .replace(/[^\w\-]+/g, '')       
                .replace(/\-\-+/g, '-')         
                .replace(/^-+/, '')             
                .replace(/-+$/, '');            
        }

        async function initBlog() {
            try {
                const themeRes = await fetch('../data/theme.json');
                if(themeRes.ok) {
                    const theme = await themeRes.json();
                    const root = document.documentElement;
                    if(theme.primary) root.style.setProperty('--c-primary', theme.primary);
                    if(theme.accent) root.style.setProperty('--c-accent', theme.accent);
                }
            } catch(e) {}
            try {
                const blogRes = await fetch('../data/blog.json');
                allArticles = blogRes.ok ? (await blogRes.json()).items : dummyArticles;
            } catch(e) { allArticles = dummyArticles; }
            allArticles.forEach(post => { if(post.category && !categories.includes(post.category)) categories.push(post.category); });
            allArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            renderTOC(); 

            // Cek URL untuk melihat apakah ada parameter '?artikel='
            const urlParams = new URLSearchParams(window.location.search);
            const artikelSlug = urlParams.get('artikel');

            if (artikelSlug) {
                // Cari artikel yang slug-nya cocok
                const index = allArticles.findIndex(post => createSafeSlug(post.title) === artikelSlug);
                if (index !== -1) {
                    // Jika ketemu, buka artikel tanpa mengubah history lagi
                    openArticle(index, false);
                    setCategory("Semua"); // Set kategori default di background
                } else {
                    setCategory("Semua");
                }
            } else {
                setCategory("Semua");
            }
        }

        function applyFilters() {
            currentPage = 1; 
            filteredArticles = allArticles.filter(post => {
                const matchCategory = currentCategory === "Semua" || post.category === currentCategory;
                const searchLower = currentSearchQuery.toLowerCase();
                const matchSearch = !currentSearchQuery || post.title.toLowerCase().includes(searchLower) || post.excerpt.toLowerCase().includes(searchLower) || (post.content && post.content.toLowerCase().includes(searchLower));
                return matchCategory && matchSearch;
            });
            renderCategoryMenu(); renderBlogList(); renderPagination();
        }

        function setCategory(cat) { currentCategory = cat; applyFilters(); }
        function handleSearch(e) { currentSearchQuery = e.target.value; applyFilters(); }
        function changePage(p) { currentPage = p; renderBlogList(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function highlightText(text, q) {
            if (!q || !text) return text;
            const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark class="bg-yellow-300 text-gray-900 px-1 rounded-sm shadow-sm">$1</mark>');
        }

        function renderCategoryMenu() {
            document.getElementById('category-filters').innerHTML = categories.map(cat => {
                const active = cat === currentCategory ? "bg-emerald-600 border-emerald-600 text-white scale-105" : "bg-white border-gray-200 text-gray-600 hover:border-emerald-500";
                return `<button onclick="setCategory('${cat}')" class="shrink-0 px-4 py-1.5 md:px-5 md:py-2 rounded-full font-medium text-xs md:text-sm transition-all border-2 cursor-pointer shadow-sm ${active}">${cat}</button>`;
            }).join('');
        }

        function renderBlogList() {
            const container = document.getElementById('blog-grid');
            const posts = filteredArticles.slice((currentPage - 1) * postsPerPage, currentPage * postsPerPage);
            if(posts.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-16">Pencarian tidak ditemukan.</div>`;
                return;
            }

            let baseUrl = window.location.origin;
            if (baseUrl === "null" || baseUrl.startsWith("file://")) {
                baseUrl = "https://kelasngaji.web.id"; 
            }

            container.innerHTML = posts.map(post => {
                const safeSlug = createSafeSlug(post.title);
                const fullArticleUrl = baseUrl + window.location.pathname + "?artikel=" + safeSlug; 
                
                return `
                <div class="bg-white rounded-2xl shadow-lg hover:shadow-xl transition-all overflow-hidden group border border-gray-100 flex flex-col h-full cursor-pointer fade-in" onclick="openArticle(${allArticles.indexOf(post)})">
                    <div class="h-52 overflow-hidden relative">
                        <img src="${post.thumbnail.startsWith('/') ? '..' + post.thumbnail : post.thumbnail}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                        <div class="absolute top-4 right-4 bg-white/90 px-3 py-1 rounded-full text-xs font-bold text-emerald-600">${post.category}</div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <div class="flex items-center flex-wrap text-xs text-gray-400 mb-2 gap-2">
                            <span><i class="far fa-calendar-alt mr-1"></i> ${new Date(post.date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</span>
                            <span>•</span>
                            <span><i class="far fa-comments mr-1"></i> <a href="${fullArticleUrl}#disqus_thread" data-disqus-identifier="${safeSlug}" class="hover:text-emerald-600 transition-colors" onclick="event.preventDefault();">0 Komentar</a></span>
                            <span>•</span>
                            <span><i class="far fa-user mr-1"></i> ${post.author || 'Admin'}</span>
                        </div>
                        <h3 class="text-xl font-bold text-emerald-900 mb-3 group-hover:text-emerald-600">${highlightText(post.title, currentSearchQuery)}</h3>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-3">${highlightText(post.excerpt, currentSearchQuery)}</p>
                        <div class="mt-auto pt-4 border-t text-gold-500 font-bold text-sm">Baca Selengkapnya →</div>
                    </div>
                </div>`
            }).join('');

            setTimeout(() => {
                if (typeof DISQUSWIDGETS !== 'undefined') {
                    DISQUSWIDGETS.getCount({reset: true});
                } else {
                    const checkDisqus = setInterval(() => {
                        if (typeof DISQUSWIDGETS !== 'undefined') {
                            DISQUSWIDGETS.getCount({reset: true});
                            clearInterval(checkDisqus);
                        }
                    }, 1000);
                    setTimeout(() => clearInterval(checkDisqus), 5000);
                }
            }, 500);
        }

        function renderPagination() {
            const container = document.getElementById('pagination-controls');
            const total = Math.ceil(filteredArticles.length / postsPerPage);
            if(total <= 1) { container.innerHTML = ""; return; }
            let html = `<button onclick="if(currentPage > 1) changePage(currentPage - 1)" class="w-10 h-10 rounded-full bg-white border flex items-center justify-center shadow-sm"><i class="fas fa-chevron-left"></i></button>`;
            for(let i=1; i<=total; i++) html += `<button onclick="changePage(${i})" class="w-10 h-10 rounded-full border ${i===currentPage ? 'bg-emerald-600 text-white' : 'bg-white'}">${i}</button>`;
            html += `<button onclick="if(currentPage < ${total}) changePage(currentPage + 1)" class="w-10 h-10 rounded-full bg-white border flex items-center justify-center shadow-sm"><i class="fas fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        function generateInlineRelatedArticles(currentIndex) {
            // 1. Ambil semua artikel kecuali artikel yang sedang dibaca saat ini
            const otherArticles = allArticles.filter((_, i) => i !== currentIndex);
            if (otherArticles.length === 0) return '';

            // 2. Acak urutan artikel (Randomize)
            const shuffledArticles = [...otherArticles].sort(() => 0.5 - Math.random());
            
            // 3. Ambil 3 artikel teratas dari hasil acakan
            const related = shuffledArticles.slice(0, 3);

            let html = `<div class="my-8 md:my-12 border-y md:border-y-0 md:border-2 border-emerald-100 py-6 md:p-6 bg-emerald-50/40 md:rounded-2xl not-prose">`;
            html += `<h4 class="text-emerald-800 font-bold text-base md:text-lg mb-4 px-4 md:px-0 flex items-center"><i class="fas fa-book-reader mr-2 text-emerald-600"></i>Baca Juga:</h4>`;
            
            html += `<div class="flex flex-nowrap overflow-x-auto snap-x snap-mandatory gap-4 pb-4 md:pb-0 px-4 md:px-0 md:grid md:grid-cols-3 md:gap-6 scrollbar-hide">`;

            related.forEach(post => {
                const relIndex = allArticles.indexOf(post);
                const relDate = new Date(post.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                
                html += `
                <div class="w-[70vw] md:w-auto flex-shrink-0 snap-center cursor-pointer group flex flex-col bg-white rounded-xl shadow-sm border border-emerald-100 hover:shadow-md transition-all overflow-hidden" onclick="openArticle(${relIndex})">
                    <div class="relative w-full pb-[56.25%] bg-gray-100 overflow-hidden">
                        <img src="${post.thumbnail.startsWith('/') ? '..' + post.thumbnail : post.thumbnail}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500 !m-0 !p-0 !shadow-none !rounded-none !border-0" alt="${post.title}">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-[10px] md:text-xs text-emerald-600 mb-1.5 font-bold uppercase tracking-wider">${post.category} <span class="text-gray-400 font-normal mx-1">•</span> <span class="text-gray-400 font-normal">${relDate}</span></span>
                        <h5 class="font-bold text-gray-800 text-sm md:text-base leading-snug group-hover:text-emerald-600 transition-colors line-clamp-3">${post.title}</h5>
                    </div>
                </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        // FUNGSI DIUBAH: Tambahan parameter updateUrl
        function openArticle(index, updateUrl = true) {
            const post = allArticles[index];
            if(!post) return;

            // Mengubah URL tanpa reload halaman (History API)
            if (updateUrl) {
                const safeSlug = createSafeSlug(post.title);
                const newUrl = window.location.pathname + "?artikel=" + safeSlug;
                window.history.pushState({ articleIndex: index }, post.title, newUrl);
            }

            document.getElementById('detail-img').src = post.thumbnail.startsWith('/') ? '..' + post.thumbnail : post.thumbnail;
            document.getElementById('detail-category').innerText = post.category;
            document.getElementById('detail-title').innerHTML = highlightText(post.title, currentSearchQuery);
            document.getElementById('detail-date').innerText = new Date(post.date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
            document.getElementById('detail-author').innerText = post.author || 'Admin';
            
            let content = post.content || "";
            content = content.replace(/\]\(\/assets\/uploads\//g, '](../assets/uploads/');
            
            let contentHtml = marked.parse(content);
            
            const inlineRelatedHtml = generateInlineRelatedArticles(index);
            contentHtml = contentHtml.replace(/<p>\s*\[BACA_JUGA\]\s*<\/p>|\[BACA_JUGA\]/gi, inlineRelatedHtml);
            
            const contentDiv = document.getElementById('detail-content');
            contentDiv.innerHTML = contentHtml;
            
            if(currentSearchQuery) {
                const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT);
                let node; const matches = [];
                while(node = walker.nextNode()) if(node.parentNode.nodeName !== 'MARK' && node.nodeValue.toLowerCase().includes(currentSearchQuery.toLowerCase())) matches.push(node);
                matches.forEach(n => {
                    const span = document.createElement('span');
                    span.innerHTML = highlightText(n.nodeValue, currentSearchQuery);
                    n.parentNode.replaceChild(span, n);
                });
            }

            const relatedContainer = document.getElementById('related-articles-grid');
            
            // Bikin rekomendasi artikel bagian Bawah jadi Random (Acak) juga!
            const otherPosts = allArticles.filter((_, i) => i !== index);
            const shuffledPosts = [...otherPosts].sort(() => 0.5 - Math.random());
            const relatedPosts = shuffledPosts.slice(0, 4);
            
            if(relatedPosts.length > 0) {
                document.getElementById('related-articles-section').classList.remove('hidden');
                relatedContainer.innerHTML = relatedPosts.map(relPost => {
                    const relIndex = allArticles.indexOf(relPost);
                    const relDate = new Date(relPost.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                    
                    return `
                    <div class="w-[70vw] md:w-auto flex-shrink-0 snap-center bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden cursor-pointer border border-gray-100 flex flex-col group" onclick="openArticle(${relIndex})">
                        <div class="relative w-full pb-[56.25%] bg-gray-100 overflow-hidden">
                            <img src="${relPost.thumbnail.startsWith('/') ? '..' + relPost.thumbnail : relPost.thumbnail}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500 !m-0 !p-0 !shadow-none !rounded-none !border-0" alt="${relPost.title}">
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <p class="text-[10px] md:text-xs text-gray-400 mb-1.5 uppercase tracking-wider font-bold text-emerald-600">${relPost.category} <span class="text-gray-300 font-normal ml-1">• ${relDate}</span></p>
                            <h4 class="font-bold text-gray-800 text-sm md:text-base leading-snug group-hover:text-emerald-600 transition-colors line-clamp-3">${relPost.title}</h4>
                        </div>
                    </div>
                    `;
                }).join('');
            } else {
                document.getElementById('related-articles-section').classList.add('hidden');
            }

            document.getElementById('blog-list-view').classList.add('hidden');
            document.getElementById('blog-detail-view').classList.remove('hidden');
            document.getElementById('blog-detail-view').classList.add('fade-in');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });

            renderDisqusComments(post.title);
        }

        function renderDisqusComments(articleTitle) {
            const disqusShortname = 'kelasngaji'; 
            
            const safeIdentifier = createSafeSlug(articleTitle);
            
            let baseUrl = window.location.origin;
            if (baseUrl === "null" || baseUrl.startsWith("file://")) {
                baseUrl = "https://kelasngaji.web.id";
            }
            const articleUrl = baseUrl + window.location.pathname + "?artikel=" + safeIdentifier;

            setTimeout(() => {
                if (typeof DISQUS !== 'undefined') {
                    DISQUS.reset({
                        reload: true,
                        config: function () {
                            this.page.identifier = safeIdentifier;
                            this.page.url = articleUrl;
                            this.page.title = articleTitle;
                        }
                    });
                } else {
                    window.disqus_config = function () {
                        this.page.identifier = safeIdentifier;
                        this.page.url = articleUrl;
                        this.page.title = articleTitle;
                    };
                    
                    const d = document, s = d.createElement('script');
                    s.src = `https://${disqusShortname}.disqus.com/embed.js`;
                    s.setAttribute('data-timestamp', +new Date());
                    (d.head || d.body).appendChild(s);
                }
            }, 500);
        }

        // FUNGSI DIUBAH: Tambahan parameter updateUrl
        function closeArticle(updateUrl = true) {
            document.getElementById('blog-detail-view').classList.add('hidden');
            document.getElementById('blog-list-view').classList.remove('hidden');
            
            // Kembalikan URL ke path aslinya (tanpa parameter ?artikel=)
            if (updateUrl) {
                window.history.pushState({ articleIndex: null }, 'Blog', window.location.pathname);
            }

            setTimeout(() => {
                if (typeof DISQUSWIDGETS !== 'undefined') {
                    DISQUSWIDGETS.getCount({reset: true});
                }
            }, 500);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // FITUR BARU: Menangani ketika user menekan tombol 'Back' atau 'Forward' di Browser
        window.addEventListener('popstate', function(event) {
            const urlParams = new URLSearchParams(window.location.search);
            const artikelSlug = urlParams.get('artikel');

            if (artikelSlug) {
                // Jika URL berubah dan punya parameter artikel, buka artikel tersebut
                const index = allArticles.findIndex(post => createSafeSlug(post.title) === artikelSlug);
                if (index !== -1) {
                    openArticle(index, false); // false = jangan push history lagi
                }
            } else {
                // Jika URL kembali ke halaman list utama, tutup artikel
                closeArticle(false); // false = jangan push history lagi
            }
        });

        function toggleTOC() {
            const p = document.getElementById('toc-panel');
            const o = document.getElementById('toc-overlay');
            const isOpen = !p.classList.contains('translate-x-full');
            if(isOpen) { p.classList.add('translate-x-full'); o.classList.add('hidden'); }
            else { p.classList.remove('translate-x-full'); o.classList.remove('hidden'); }
        }

        // --- FITUR BARU: Toggle Animasi Dropdown Kategori ---
        function toggleTocCategory(btn) {
            const item = btn.parentElement;
            const content = item.querySelector('.toc-category-content');
            const isOpen = item.classList.contains('active');

            // Tutup semua kategori lain terlebih dahulu
            document.querySelectorAll('.toc-category-item').forEach(other => {
                other.classList.remove('active');
                other.querySelector('.toc-category-content').style.maxHeight = null;
            });

            // Buka yang di-klik jika sebelumnya tertutup
            if (!isOpen) {
                item.classList.add('active');
                content.style.maxHeight = content.scrollHeight + "px";
            }
        }

        // --- FITUR BARU: Render Daftar Isi dengan Dropdown (Accordion) Berdasarkan Kategori ---
        function renderTOC() {
            document.getElementById('toc-count').innerText = allArticles.length;
            
            // 1. Mengelompokkan artikel berdasarkan kategori
            const groupedArticles = {};
            allArticles.forEach((post, index) => {
                const cat = post.category || "Lain-Lain";
                if (!groupedArticles[cat]) groupedArticles[cat] = [];
                groupedArticles[cat].push({ post, index });
            });

            let html = '';
            
            // 2. Merakit HTML Dropdown untuk setiap kategori
            for (const cat in groupedArticles) {
                const articles = groupedArticles[cat];
                if (articles.length === 0) continue;

                html += `
                <div class="toc-category-item mb-2 bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden transition-all">
                    <!-- Tombol Judul Kategori -->
                    <button onclick="toggleTocCategory(this)" class="w-full flex justify-between items-center p-4 text-left hover:bg-emerald-50 transition-colors focus:outline-none">
                        <span class="font-bold text-emerald-800 text-sm uppercase tracking-wider">
                            ${cat} <span class="text-gray-400 text-xs ml-1 font-normal">(${articles.length})</span>
                        </span>
                        <i class="fas fa-chevron-down text-emerald-500 text-sm toc-icon"></i>
                    </button>
                    
                    <!-- Isi Dropdown (Daftar Judul Artikel) -->
                    <div class="toc-category-content bg-emerald-50/30">
                        <div class="p-2 border-t border-gray-50 space-y-1">
                `;

                articles.forEach(item => {
                    html += `
                            <button onclick="toggleTOC(); setTimeout(()=>openArticle(${item.index}),300)" class="w-full text-left p-3 rounded-lg hover:bg-emerald-100 transition-colors group flex gap-3 items-start">
                                <div class="w-1.5 h-1.5 mt-1.5 rounded-full bg-emerald-300 group-hover:bg-emerald-600 shrink-0 transition-colors"></div>
                                <h4 class="text-xs font-semibold text-gray-700 group-hover:text-emerald-900 leading-snug">${item.post.title}</h4>
                            </button>
                    `;
                });

                html += `
                        </div>
                    </div>
                </div>
                `;
            }

            document.getElementById('toc-list').innerHTML = html;
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
        document.addEventListener('DOMContentLoaded', initBlog);
    </script>
    
    <!-- Script Penghitung Komentar Disqus -->
    <script id="dsq-count-scr" src="//kelasngaji.disqus.com/count.js" async></script>
</body>
</html>
